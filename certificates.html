<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Certificates | Jeshurun Villamor</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body>
        <div id="background"></div>
        <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>

        <header>
            <h1>Jeshurun Villamor</h1>
            <div class="header-actions">
                <input type="checkbox" id="nav-toggle" class="nav-toggle-input" aria-hidden="true">
                <label for="nav-toggle" class="nav-toggle" aria-label="Toggle navigation"><span></span></label>
                <nav class="nav-links">
                    <a class="button home-button" href="index.html">Home</a>
                    <a class="button about-button" href="about.html">About</a>
                    <a class="button techstack-button" href="tech-stack.html">Tech Stack</a>
                    <a class="button certificates-button" href="certificates.html">Certifications</a>
                </nav>
            </div>
        </header>
        
        <section class="page-heading">
            <h2>Certifications</h2>
        </section>

        <div class = "certificates-grid flex flex-wrap justify-center gap-10">
            <div class = "w-full sm:w-1/2 md:w-1/3 lg:w-1/3 p-4 aspect-[4/3] text-center
            bg-[#493fff91] rounded-lg shadow-2xl shadow-[#493fff91] m-6 mbe-3 hover:scale-105">
                <img src = "images/WordCertificate.jpg"
                    class = "rounded-lg cursor-pointer"
                    data-modal-src="images/WordCertificate.jpg">

                <p class="block font-bold text-white pt-2 mbe-3 m-2 text-2xl"> MS Word Associate </p>

                <a href="https://www.certiport.com/portal/pages/credentialverification.aspx"
                    target="_blank" 
                    class="mt-3 px-4 py-2 bg-[#6215f1c8] text-white font-semibold rounded-lg hover:bg-[#493fffa1] transition">Verify certification</a>
            </div>

            <div class = "w-full sm:w-1/2 md:w-1/3 lg:w-1/3 p-4 text-center
                bg-[#493fff91] rounded-lg shadow-2xl shadow-[#493fff91] m-6 mbe-3 hover:scale-105">
                <img src = "images/PowerPointCertificate.jpg" 
                    class = "rounded-lg cursor-pointer" 
                    data-modal-src="images/PowerPointCertificate.jpg">

                <p class="block font-bold text-white pt-2 mbe-3 m-2 text-2xl">MS PowerPoint Associate</p>

                <a href="https://www.certiport.com/portal/pages/credentialverification.aspx"
                    target="_blank" 
                    class="mt-3 px-4 py-2 bg-[#6215f1c8] text-white font-semibold rounded-lg hover:bg-[#493fffa1] transition">Verify certification</a>
            </div>
        </div>

        <div id="imageModal" class="fixed inset-0 hidden bg-black/80 flex items-center justify-center z-50">
            <img id="modalImg" class="max-w-[90%] max-h-[90%] rounded shadow-lg">
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
        <script src="animations.js"></script>
    </body>
</html>
